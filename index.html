<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiusi Liu</title>
  <meta name="description" content="Personal page of Jiusi Liu.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <style>
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #2563eb;
      --border: #e7e5e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #60a5fa;
        --border: #292524;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    main { max-width: 560px; width: 100%; }
    h1 { font-size: 2.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); font-size: 1.125rem; margin-top: 0.25rem; }
    section { margin-top: 2rem; }
    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    p + p { margin-top: 0.75rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; list-style: none; }
    .links a {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hi, I'm Jiusi.</h1>
      <p class="tagline">A short line about what you do.</p>
    </header>

    <section>
      <h2>About</h2>
      <p>A few sentences about yourself: what you work on, what you're interested in, or what you're up to right now.</p>
    </section>

    <section>
      <h2>Elsewhere</h2>
      <ul class="links">
        <li><a href="mailto:you@example.com">Email</a></li>
        <li><a href="https://github.com/your-username">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/your-username">LinkedIn</a></li>
      </ul>
    </section>

    <footer>&copy; <span id="year"></span> Jiusi Liu</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
