<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiusi Liu</title>
  <meta name="description" content="Personal page of Jiusi Liu.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f0e1;
      --text: #2b2620;
      --muted: #7a6e5d;
      --accent: #9a4a24;
      --border: #ddd2b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }
    body {
      font-family: "PT Serif", Georgia, serif;
      color: var(--text);
      line-height: 1.6;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main { max-width: 560px; width: 100%; }
    h1 { font-size: 2.5rem; font-weight: 700; line-height: 1.2; }
    .tagline { color: var(--muted); font-size: 1.125rem; font-style: italic; margin-top: 0.25rem; }
    section { margin-top: 2rem; }
    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    p + p { margin-top: 0.75rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; list-style: none; }
    .links a {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hi, I'm Jiusi.</h1>
      <p class="tagline">A short line about what you do.</p>
    </header>

    <section>
      <h2>About</h2>
      <p>A few sentences about yourself: what you work on, what you're interested in, or what you're up to right now.</p>
    </section>

    <section>
      <h2>Elsewhere</h2>
      <ul class="links">
        <li><a href="mailto:you@example.com">Email</a></li>
        <li><a href="https://github.com/your-username">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/your-username">LinkedIn</a></li>
      </ul>
    </section>

    <footer>&copy; <span id="year"></span> Jiusi Liu</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
