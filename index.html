<body>
  <main>
    <h1>Edward “JiuJiu” Liu<br><span lang="zh-Hant">劉九思</span></h1>
    <p>I'm <span id="age">18</span> years old and from West Lafayette, Indiana. I'm on leave from Stanford to build <a href="https://reconero.com">Reconero (YC F26)</a> in SF.</p>
    <p>
      <a href="mailto:liuedward662@gmail.com">Email</a> ·
      <a href="https://github.com/jooj99">GitHub</a> ·
      <a href="https://www.linkedin.com/in/jiujiu-liu">LinkedIn</a>
    </p>
  </main>
  <script>
    const birthday = new Date(2008, 3, 28); // April 28, 2008
    const today = new Date();
    let age = today.getFullYear() - birthday.getFullYear();
    if (today.getMonth() < birthday.getMonth() ||
        (today.getMonth() === birthday.getMonth() && today.getDate() < birthday.getDate())) {
      age--;
    }
    document.getElementById("age").textContent = age;
  </script>
